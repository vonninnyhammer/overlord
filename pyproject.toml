[project]
name = "overlord"
version = "0.1.0"
description = "Deterministic, policy-gated pipeline for defensive cyber operations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/vonninnyhammer/overlord"
dependencies = [
  "pydantic>=2",
  "jsonschema>=4",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
